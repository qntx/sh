name: Sync

on:
  schedule:
    # Hourly. Release pipelines that need a fresh lock immediately can
    # dispatch Sync instead: `gh workflow run sync.yml -R qntx/sh -f
    # tool=<key>` needs a token with `actions: write` on qntx/sh.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Optional catalog key to sync only that tool"
        required: false
        type: string
      source:
        description: "Optional skills source to sync only that source"
        required: false
        type: string
      force:
        description: "Accept a shrinking target set"
        required: false
        type: boolean
        default: false
      deploy-sk:
        description: "Deploy apps/sk even when this run changes nothing in it"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sh: ${{ steps.status.outputs.sh }}
      sk: ${{ steps.status.outputs.sk }}
      ref: ${{ steps.push.outputs.ref }}
      sk-changed: ${{ steps.push.outputs.sk-changed }}
      wrangler: ${{ steps.wrangler.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - run: bun install --frozen-lockfile

      # The deploy-sk job installs exactly the wrangler apps/sk pins, so
      # the locked toolchain and the deployed one cannot drift apart.
      - id: wrangler
        run: |
          v=$(jq -r '.devDependencies.wrangler' apps/sk/package.json)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::apps/sk devDependencies.wrangler is not an exact X.Y.Z pin: $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Per-tool isolation: a failed tool keeps its previous lock entry
      # while the rest sync and are committed. Each step writes its
      # status JSON for the issues job.
      - id: sh
        continue-on-error: true
        run: cd apps/sh && bun run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_TOOL: ${{ inputs.tool }}
          SYNC_FORCE: ${{ inputs.force }}
          SYNC_STATUS: ${{ runner.temp }}/sh-status.json

      - id: sk
        continue-on-error: true
        run: cd apps/sk && bun run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_SOURCE: ${{ inputs.source }}
          SYNC_STATUS: ${{ runner.temp }}/sk-status.json

      # Cloudflare Workers Builds deploys apps/sh to production from every
      # push to main, this lock commit included: a broken lock must fail
      # this offline build before anything is committed.
      - run: bun run build

      - name: Commit lock and tools
        id: push
        shell: bash
        env:
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git add -- apps/sh/releases.json apps/sk/skills.lock.json apps/sk/content
          if git diff --cached --quiet -- apps/sk/skills.lock.json apps/sk/content; then
            echo "sk-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "sk-changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo 'No sync changes.'
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(sync): update releases"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase
            echo "push attempt $attempt failed; rebased"
          done
          echo '::error::Failed to push after 3 attempts.'
          exit 1

      # After the commit so tracking issues only reflect runs whose lock
      # was built and committed. Outputs are the compact status JSON of
      # each app, empty when the app produced no status file.
      - name: Export sync status
        id: status
        env:
          SH_STATUS_FILE: ${{ runner.temp }}/sh-status.json
          SK_STATUS_FILE: ${{ runner.temp }}/sk-status.json
        run: |
          if [ -s "$SH_STATUS_FILE" ]; then
            echo "sh=$(jq -c . "$SH_STATUS_FILE")" >> "$GITHUB_OUTPUT"
          fi
          if [ -s "$SK_STATUS_FILE" ]; then
            echo "sk=$(jq -c . "$SK_STATUS_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the run while any tool fails
        if: steps.sh.outcome == 'failure' || steps.sk.outcome == 'failure'
        run: |
          echo '::error::One or more tools failed to sync; see the step logs and the tracking issues.'
          exit 1

  # sk.qntx.org is not on Workers Builds: deploy it from here whenever this
  # run committed a change under apps/sk (or a dispatch asks for it), even
  # when another tool failed to sync. Environment secrets are only visible
  # to jobs in that environment, so the credentials check runs in one.
  sk-credentials:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.ref != '' && (needs.sync.outputs.sk-changed == 'true' || inputs.deploy-sk) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions: {}
    outputs:
      error: ${{ steps.check.outputs.error }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            exit 0
          fi
          msg="Environment 'production' has no secret CLOUDFLARE_API_TOKEN, so apps/sk cannot be deployed. Create it under Settings > Environments > production > Environment secrets, then run: gh workflow run sync.yml -R qntx/sh -f deploy-sk=true"
          echo "::error::$msg"
          echo "error=$msg" >> "$GITHUB_OUTPUT"
          exit 1

  deploy-sk:
    needs: [sync, sk-credentials]
    if: ${{ !cancelled() && needs.sk-credentials.result == 'success' }}
    # deploy-cloudflare.yml is not in a qntx/workflows release yet, so it is
    # pinned to the main commit that added it (qntx/workflows#132). Move to
    # @v2 after v2.14.0 is released.
    uses: qntx/workflows/.github/workflows/deploy-cloudflare.yml@0e58414f3abfca70d33a2c61f993495bb20882fb
    permissions:
      contents: read
    secrets:
      # The called job runs in `environment: production`, which resolves
      # these names to that environment's secrets.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    with:
      ref: ${{ needs.sync.outputs.ref }}
      environment: production
      runs-on: ubuntu-24.04
      working-directory: apps/sk
      build-directory: .
      build-command: bun install --frozen-lockfile && bun run --cwd apps/sk build
      wrangler-version: ${{ needs.sync.outputs.wrangler }}

  issues:
    needs: [sync, sk-credentials, deploy-sk]
    if: ${{ !cancelled() && (needs.sync.outputs.sh != '' || needs.sync.outputs.sk != '' || needs.sk-credentials.result == 'failure' || needs.deploy-sk.result == 'success' || needs.deploy-sk.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - run: bun scripts/track-sync.ts
        env:
          GH_TOKEN: ${{ github.token }}
          SH_STATUS: ${{ needs.sync.outputs.sh }}
          SK_STATUS: ${{ needs.sync.outputs.sk }}
          SK_DEPLOY: ${{ needs.sk-credentials.result == 'failure' && 'failure' || needs.deploy-sk.result }}
          SK_DEPLOY_ERROR: ${{ needs.sk-credentials.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
